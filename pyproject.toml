[project]
name = "deep-learning-doc-classification"
version = "0.1.0"
description = ""
authors = [
    {name = "sagerstack",email = "sagarpratapsingh15@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14.1"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)",
    "datasets (>=4.8.4,<5.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "torch-geometric (>=2.7.0,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "python-doctr[torch] (>=1.0.1,<2.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "jinja2-fragments (>=1.11.0,<2.0.0)",
    "python-multipart (>=0.0.24,<0.0.25)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "ultralytics (>=8.0.0,<9.0.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    "plotly (>=5.0.0,<6.0.0)",
    "evidently (>=0.7.0,<1.0.0)",
    "pandas (>=2.0.0,<4.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "pytesseract (>=0.3.10,<0.4.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "seqlog (>=0.4.3,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
markers = [
    "slow: marks tests that require model loading (deselect with '-m \"not slow\"')",
]

